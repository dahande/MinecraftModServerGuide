# Fly.io configuration for the 7DTD status API.
# `app` 名はデプロイ時に自動で書き換わる (flyctl launch 時)。

app            = "nonbiri-7dtd-status"
primary_region = "nrt"                    # Tokyo

[build]

[http_service]
  internal_port          = 8080
  force_https            = true
  auto_stop_machines     = "stop"         # 未使用時はマシン停止 (無料枠節約)
  auto_start_machines    = true
  min_machines_running   = 0

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"

[env]
  SERVER_HOST   = "220.158.24.94"
  SERVER_PORT   = "26900"
  CACHE_SEC     = "20"
  QUERY_TIMEOUT = "3"
  ALLOW_ORIGINS = "https://dahande.github.io"
