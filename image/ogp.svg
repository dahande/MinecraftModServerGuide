<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0c1c40"/>
      <stop offset="50%"  stop-color="#07090f"/>
      <stop offset="100%" stop-color="#150829"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8eef8"/>
      <stop offset="50%"  stop-color="#8ec5fc"/>
      <stop offset="100%" stop-color="#d4abff"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f87171"/>
      <stop offset="50%"  stop-color="#4d9fff"/>
      <stop offset="100%" stop-color="#b57cf8"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="white" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Dot grid -->
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Blue glow left -->
  <ellipse cx="180" cy="315" rx="420" ry="300" fill="#4d9fff" fill-opacity="0.07"/>
  <!-- Purple glow right -->
  <ellipse cx="1050" cy="315" rx="380" ry="300" fill="#b57cf8" fill-opacity="0.05"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#topBar)"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="1198" height="628" fill="none"
        stroke="rgba(44,63,96,0.55)" stroke-width="2"/>

  <!-- ── Left content ── -->

  <!-- "GAME SERVER" eyebrow badge -->
  <rect x="80" y="158" width="210" height="34" rx="17"
        fill="rgba(77,159,255,0.08)" stroke="rgba(77,159,255,0.28)" stroke-width="1.5"/>
  <text x="185" y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13" font-weight="700" fill="#4d9fff" letter-spacing="3">
    GAME SERVER
  </text>

  <!-- Main title line 1 -->
  <text x="80" y="295"
        font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Arial,sans-serif"
        font-size="74" font-weight="900" fill="url(#titleGrad)">
    のんびり
  </text>
  <!-- Main title line 2 -->
  <text x="80" y="383"
        font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Arial,sans-serif"
        font-size="74" font-weight="900" fill="url(#titleGrad)">
    サバイバル鯖
  </text>

  <!-- Subtitle -->
  <text x="80" y="433"
        font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Arial,sans-serif"
        font-size="20" fill="#566880">
    みんなで気軽に楽しめるゲームサーバー
  </text>

  <!-- 7DTD status pill -->
  <rect x="80" y="463" width="310" height="42" rx="21"
        fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.38)" stroke-width="1.5"/>
  <!-- Pulse dot -->
  <circle cx="114" cy="484" r="8" fill="#f87171" fill-opacity="0.25"/>
  <circle cx="114" cy="484" r="5" fill="#f87171"/>
  <text x="134" y="490"
        font-family="Arial, sans-serif"
        font-size="16" font-weight="700" fill="#f87171">
    7 Days to Die  稼働中
  </text>

  <!-- ── Right decoration: ghost "7" ── -->
  <text x="960" y="500"
        text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-size="380" font-weight="900"
        fill="#f87171" fill-opacity="0.04">
    7
  </text>

  <!-- Thin vertical divider -->
  <line x1="750" y1="80" x2="750" y2="550"
        stroke="rgba(44,63,96,0.35)" stroke-width="1"/>

  <!-- Bottom-right: site URL hint -->
  <text x="1120" y="598"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="13" fill="#2c3f60">
    dahande.github.io/MinecraftModServerGuide
  </text>
</svg>
